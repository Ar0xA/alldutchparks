baseURL = "https://alldutchparks.nl/"
languageCode = "en-us"
title = "alldutchparks.nl"
enableRobotsTXT = true

# Activation reports are dated by when the QSO session happened, not
# editorially scheduled - without this, Hugo's default buildFuture=false
# silently drops any activation timestamped after the last build, which
# broke "featured = newest activation" on the homepage.
buildFuture = true

[markup.goldmark.renderer]
  unsafe = true

# Park totals and per-province progress are computed live from data/parks.json
# and the activities section — see layouts/parks/list.html, layouts/map/list.html
# and layouts/index.html.
